<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Pedido - 506 Logistics</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#2438d6;
      --navy-deep:#131c74;
      --blue:#2438d6;
      --lime:#f2e94e;
      --paper:#f7f7f5;
      --ink:#12142b;
      --slate:#5b6172;
      --line:#e3e3dd;
      --r-pill:999px;
      --r-card:22px;
      --r-sm:14px;
      --shadow-sm:0 1px 2px rgba(18,20,43,.04), 0 1px 1px rgba(18,20,43,.03);
      --shadow-md:0 12px 32px -12px rgba(18,20,43,.16);
      --shadow-lg:0 24px 48px -16px rgba(18,20,43,.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html{scroll-behavior:smooth;}
    body { font-family: 'Plus Jakarta Sans', sans-serif; color:var(--ink); background: var(--paper); min-height: 100vh; padding: 0 0 60px; line-height:1.6; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    .hero-panel { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%); border-radius: 0 0 32px 32px; margin-bottom: -8px; }
    header { text-align: center; color: white; padding: 56px 0 40px; }
    .brand-mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;}
    .brand-mark svg{color:var(--lime);}
    .brand-mark span{font-weight:800;font-size:20px;letter-spacing:-0.01em;}
    header h1 { font-size: clamp(28px,4.5vw,40px); margin-bottom: 10px; font-weight: 800; letter-spacing:-0.02em; }
    header p { color:#c3c9f5; font-size:15px; }

    .search-card { background: white; border-radius: var(--r-card); padding: 36px; box-shadow: var(--shadow-lg); margin-bottom: 24px; margin-top:-8px; }
    .search-form { display: flex; gap: 12px; flex-wrap: wrap; }
    .search-form input { flex: 1; min-width: 220px; padding: 15px 20px; border: 1.5px solid var(--line); background:var(--paper); border-radius: var(--r-sm); font-size: 15px; font-family:inherit; }
    .search-form input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(36,56,214,.12); }
    .search-form button { padding: 15px 34px; background: var(--lime); color: var(--navy-deep); border: none; border-radius: var(--r-pill); font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; display:inline-flex; align-items:center; gap:8px; }
    .search-form button:hover { background:#f7f177; transform:translateY(-2px); box-shadow:var(--shadow-md); }

    .loading { display: none; text-align: center; padding: 50px 20px; color: white; }
    .loading.active { display: block; }
    .loading-spinner { border: 3px solid rgba(255, 255, 255, 0.25); border-top: 3px solid var(--lime); border-radius: 50%; width: 38px; height: 38px; animation: spin 0.9s linear infinite; margin: 0 auto 18px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error { display: none; background: #fff; color: #b3261e; padding: 20px 24px; border-radius: var(--r-sm); margin-bottom: 24px; box-shadow: var(--shadow-sm); font-weight: 600; }
    .error.active { display: flex; align-items:center; gap:10px; }

    .results { display: none; }
    .results.active { display: block; }
    .tracking-info { background: white; border-radius: var(--r-card); padding: 36px; margin-bottom: 24px; box-shadow: var(--shadow-lg); }
    .status-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap:wrap; gap:16px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    #trackingNumber{ font-size:15px; font-weight:600; color:var(--slate); margin-bottom:12px; letter-spacing:0.01em; }
    .status-badge { display: inline-flex; align-items:center; gap:8px; padding: 10px 20px; border-radius: var(--r-pill); font-weight: 700; font-size: 15px; }
    .status-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;}
    .status-en-proceso, .status-asignar-piloto { background: #e6e9fb; color: var(--blue); }
    .status-pendiente { background: #fff3cd; color: #8a6300; }
    .status-confirmado { background: #e6e9fb; color: var(--blue); }
    .status-en-camino, .status-en-tránsito { background: #d9f0ff; color: #0a6cad; }
    .status-entregado { background: #e6f9ea; color: #1c8a44; }
    .status-novedad-en-la-entrega { background: #ffe9e5; color: #c1391f; }
    .status-cancelado { background: #f1f1ee; color: var(--slate); }
    .status-devuelto { background: #fdeee0; color: #b35c00; }
    .status-desconocido { background: #f1f1ee; color: var(--slate); }
    .update-meta{ text-align: right; color: var(--slate); }
    .update-meta .k{font-size:12.5px; margin-bottom:4px;}
    .update-meta .v{font-weight:700; color:var(--ink); font-size:14.5px;}

    .tracking-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .info-card { background: var(--paper); padding: 20px 22px; border-radius: var(--r-sm); }
    .info-card h3 { font-size: 12px; color: var(--slate); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight:600; }
    .info-card p { font-size: 15.5px; font-weight: 700; color: var(--ink); }

    .progress-stepper { margin: 8px 0 30px; }
    .progress-track { position: relative; height: 4px; background: var(--line); border-radius: 999px; margin: 0 12px 16px; }
    .progress-track-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--blue); border-radius: 999px; transition: width .3s ease; }
    .progress-steps { display: flex; justify-content: space-between; }
    .progress-step { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; text-align: center; padding: 0 2px; }
    .progress-step .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 3px solid var(--line); }
    .progress-step.done .dot { background: var(--blue); border-color: var(--blue); }
    .progress-step.current .dot { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 0 4px rgba(242,233,78,.35); }
    .progress-step.issue .dot { background: #e0574c; border-color: #e0574c; box-shadow: 0 0 0 4px rgba(224,87,76,.2); }
    .progress-step.returned .dot { background: #e0894c; border-color: #e0894c; box-shadow: 0 0 0 4px rgba(224,137,76,.2); }
    .progress-step.returned .label { color: #b0602f; }
    .progress-step .label { font-size: 11.5px; font-weight: 600; color: var(--slate); line-height: 1.3; }
    .progress-step.done .label, .progress-step.current .label { color: var(--ink); }
    .progress-cancelled { display: flex; align-items: center; gap: 10px; background: #fdeceb; color: #b03a30; border-radius: var(--r-sm); padding: 14px 18px; font-weight: 700; font-size: 14.5px; }
    @media (max-width: 640px) {
      .progress-step .label { font-size: 10px; }
    }

    .timeline { margin-top: 8px; }
    .timeline h3 { font-size: 17px; margin-bottom: 20px; color: var(--ink); font-weight:700; display:flex; align-items:center; gap:10px; }
    .timeline h3 i{color:var(--blue);}
    .timeline-event { display: flex; gap: 18px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .timeline-event:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
    .timeline-dot { min-width: 10px; width: 10px; height: 10px; background: var(--blue); border-radius: 50%; margin-top: 6px; }
    .timeline-content h4 { font-size: 15px; color: var(--ink); margin-bottom: 4px; font-weight:700; }
    .timeline-content .time { font-size: 13px; color: var(--slate); }
    .timeline-content p{font-size:13.5px; color:var(--slate); margin-top:4px;}

    .qr-section { text-align: center; padding: 24px; background: var(--paper); border-radius: var(--r-sm); margin-top: 24px; }
    .qr-section p{color:var(--slate); font-size:14px;}
    .qr-section img { max-width: 176px; margin: 14px 0; border-radius:8px; }

    @media (max-width: 768px) {
      body{padding:0 0 50px;}
      .container{padding:0 16px;}
      header{padding:44px 0 32px;}
      .search-card, .tracking-info{padding:26px;}
      .search-form { flex-direction: column; }
      .search-form button{ justify-content:center; }
      .status-header{ flex-direction:column; }
      .update-meta{ text-align:left; }
      #map { height: 280px; }
    }
  </style>
</head>
<body>
  <div class="hero-panel">
    <div class="container">
      <header>
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 20L10.5 2H16.5L8 20H2Z" fill="currentColor"/><path d="M11.5 20L20 2H24L15.5 20H11.5Z" fill="currentColor" opacity="0.5"/></svg>
          <span>506 logistics</span>
        </div>
        <h1>Rastrear pedido</h1>
        <p>Consulta el estado de tu guía en tiempo real</p>
      </header>
    </div>
  </div>

  <div class="container">
    <div class="search-card">
      <div class="search-form">
        <input type="text" id="trackingInput" placeholder="Ingresa tu número de rastreo">
        <button onclick="searchTracking()"><i class="fas fa-search"></i> Rastrear</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>Buscando tu pedido...</p>
    </div>

    <div class="error" id="error"><i class="fas fa-circle-exclamation"></i><span></span></div>

    <div class="results" id="results">
      <div class="tracking-info">
        <div class="status-header">
          <div>
            <h2 id="trackingNumber"></h2>
            <span class="status-badge" id="statusBadge"></span>
          </div>
          <div class="update-meta">
            <p class="k">Última actualización</p>
            <p class="v" id="updatedAt"></p>
          </div>
        </div>

        <div class="progress-stepper" id="progressStepper"></div>

        <div class="tracking-grid">
          <div class="info-card"><h3>Destinatario</h3><p id="recipientName">-</p></div>
          <div class="info-card"><h3>Teléfono</h3><p id="recipientPhone">-</p></div>
          <div class="info-card"><h3 id="estimatedDeliveryLabel">Entrega Estimada</h3><p id="estimatedDelivery">-</p></div>
        </div>

        <div class="timeline">
          <h3><i class="fas fa-clock-rotate-left"></i> Historial de Eventos</h3>
          <div id="timeline"></div>
        </div>

        <div class="qr-section" id="qrSection" style="display: none;">
          <p style="font-weight: 600; color: var(--ink);">Comparte tu rastreo</p>
          <img id="qrCode" src="" alt="QR Code">
          <p>Escanea para compartir</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    async function searchTracking(id = null) {
      id = id || document.getElementById('trackingInput').value.trim();
      if (!id) { showError('Por favor ingresa un número'); return; }

      showLoading(true);
      try {
        const endpoint = id.startsWith('TRA-') ? `${API_URL}/api/tracking/public/${id}` : `${API_URL}/api/tracking/${id}`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(response.status === 404 ? 'Pedido no encontrado' : `Error ${response.status}`);
        const data = await response.json();
        displayTracking(data);
      } catch (error) {
        showError(error.message);
      } finally {
        showLoading(false);
      }
    }

    function displayTracking(data) {
      document.getElementById('trackingNumber').textContent = `Rastreo: ${data.tracking_id}`;
      const badge = document.getElementById('statusBadge');
      badge.textContent = data.status;
      badge.className = `status-badge status-${data.status.toLowerCase().replace(/ /g, '-')}`;

      const date = new Date(data.updated_at);
      document.getElementById('updatedAt').textContent = date.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      document.getElementById('recipientName').textContent = data.recipient_name || '-';
      document.getElementById('recipientPhone').textContent = data.recipient_phone || '-';
      document.getElementById('estimatedDeliveryLabel').textContent = data.estimated_delivery_label || 'Entrega Estimada';
      document.getElementById('estimatedDelivery').textContent = data.estimated_delivery_display || '-';

      renderProgress(data.progress);
      if (data.events?.length) displayTimeline(data.events);

      const url = window.location.href;
      if (url.includes('/rastreo/')) {
        document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
        document.getElementById('qrSection').style.display = 'block';
      }

      document.getElementById('results').classList.add('active');
    }

    function renderProgress(progress) {
      const container = document.getElementById('progressStepper');
      if (!progress || !Array.isArray(progress.stages) || !progress.stages.length) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'block';

      if (progress.state === 'cancelled') {
        container.innerHTML = `<div class="progress-cancelled"><i class="fas fa-circle-exclamation"></i> Este pedido no sigue el flujo normal de entrega</div>`;
        return;
      }

      const total = progress.stages.length;
      const idx = Math.max(0, progress.current_index);
      const fillPct = total > 1 ? (idx / (total - 1)) * 100 : 0;

      const stepsHtml = progress.stages.map((label, i) => {
        let cls = 'progress-step';
        if (i < idx) cls += ' done';
        else if (i === idx) {
          if (progress.state === 'issue') cls += ' issue';
          else if (progress.state === 'returned') cls += ' returned';
          else cls += ' current';
        }
        return `<div class="${cls}"><div class="dot"></div><span class="label">${label}</span></div>`;
      }).join('');

      container.innerHTML = `
        <div class="progress-track"><div class="progress-track-fill" style="width:${fillPct}%"></div></div>
        <div class="progress-steps">${stepsHtml}</div>
      `;
    }

    function displayTimeline(events) {
      document.getElementById('timeline').innerHTML = events.map(e => {
        const date = new Date(e.timestamp).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `<div class="timeline-event"><div class="timeline-dot"></div><div class="timeline-content"><h4>${e.status}</h4><span class="time">${date}</span>${e.description ? `<p>${e.description}</p>` : ''}</div></div>`;
      }).join('');
    }

    function showLoading(show) { document.getElementById('loading').classList.toggle('active', show); }
    function showError(msg) { const e = document.getElementById('error'); e.querySelector('span').textContent = msg; e.classList.add('active'); }

    document.getElementById('trackingInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') searchTracking(); });
  </script>
</body>
</html>
