<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Pedido - Transportadora 506</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; color: white; margin-bottom: 40px; padding-top: 20px; }
    header h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; }
    .search-card { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); margin-bottom: 30px; }
    .search-form { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-form input { flex: 1; min-width: 250px; padding: 14px 20px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
    .search-form input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .search-form button { padding: 14px 40px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .search-form button:hover { background: #5568d3; }
    .loading { display: none; text-align: center; padding: 40px; color: white; }
    .loading.active { display: block; }
    .loading-spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error { display: none; background: #fee; color: #c33; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #c33; }
    .error.active { display: block; }
    .results { display: none; }
    .results.active { display: block; }
    .tracking-info { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); }
    .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
    .status-badge { display: inline-block; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 1.1rem; }
    .status-en-tránsito { background: #d1ecf1; color: #0c5460; }
    .status-entregado { background: #d4edda; color: #155724; }
    .status-pendiente { background: #fff3cd; color: #856404; }
    .tracking-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .info-card { background: #f9f9f9; padding: 20px; border-radius: 8px; border-left: 4px solid #667eea; }
    .info-card h3 { font-size: 0.9rem; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-card p { font-size: 1.1rem; font-weight: 600; color: #333; }
    .map-container { border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); }
    #map { height: 400px; width: 100%; }
    .timeline { margin-top: 30px; }
    .timeline h3 { font-size: 1.3rem; margin-bottom: 20px; color: #333; }
    .timeline-event { display: flex; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f0f0f0; }
    .timeline-dot { min-width: 12px; width: 12px; height: 12px; background: #667eea; border-radius: 50%; margin-top: 6px; }
    .timeline-content h4 { font-size: 1rem; color: #333; margin-bottom: 4px; }
    .timeline-content .time { font-size: 0.9rem; color: #999; }
    .qr-section { text-align: center; padding: 20px; background: #f9f9f9; border-radius: 8px; margin-top: 20px; }
    .qr-section img { max-width: 200px; }
    @media (max-width: 768px) { header h1 { font-size: 1.8rem; } .search-form { flex-direction: column; } #map { height: 300px; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-truck"></i> Rastrear Pedido</h1>
      <p>Transportadora 506</p>
    </header>

    <div class="search-card">
      <div class="search-form">
        <input type="text" id="trackingInput" placeholder="Ingresa tu número de rastreo">
        <button onclick="searchTracking()"><i class="fas fa-search"></i> Rastrear</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>Buscando tu pedido...</p>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results">
      <div class="tracking-info">
        <div class="status-header">
          <div>
            <h2 id="trackingNumber" style="margin-bottom: 10px; color: #333;"></h2>
            <span class="status-badge" id="statusBadge"></span>
          </div>
          <div style="text-align: right; color: #666;">
            <p style="font-size: 0.9rem;">Última actualización</p>
            <p id="updatedAt" style="font-weight: 600;"></p>
          </div>
        </div>

        <div class="tracking-grid">
          <div class="info-card"><h3>Destinatario</h3><p id="recipientName">-</p></div>
          <div class="info-card"><h3>Teléfono</h3><p id="recipientPhone">-</p></div>
          <div class="info-card"><h3>Entrega Estimada</h3><p id="estimatedDelivery">-</p></div>
          <div class="info-card"><h3>Transportista</h3><p id="carrier">-</p></div>
          <div class="info-card"><h3>Conductor</h3><p id="driver">-</p></div>
          <div class="info-card"><h3>Teléfono Conductor</h3><p id="driverPhone">-</p></div>
        </div>

        <div class="map-container" id="mapContainer" style="display: none;">
          <div id="map"></div>
        </div>

        <div class="timeline">
          <h3><i class="fas fa-history"></i> Historial de Eventos</h3>
          <div id="timeline"></div>
        </div>

        <div class="qr-section" id="qrSection" style="display: none;">
          <p style="margin-bottom: 15px; font-weight: 600;">Comparte tu rastreo</p>
          <img id="qrCode" src="" alt="QR Code">
          <p>Escanea para compartir</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    let map = null, marker = null;
    const API_URL = window.location.origin;

    async function searchTracking(id = null) {
      id = id || document.getElementById('trackingInput').value.trim();
      if (!id) { showError('Por favor ingresa un número'); return; }
      
      showLoading(true);
      try {
        const endpoint = id.startsWith('TRA-') ? `${API_URL}/api/tracking/public/${id}` : `${API_URL}/api/tracking/${id}`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(response.status === 404 ? 'Pedido no encontrado' : `Error ${response.status}`);
        const data = await response.json();
        displayTracking(data);
      } catch (error) {
        showError(error.message);
      } finally {
        showLoading(false);
      }
    }

    function displayTracking(data) {
      document.getElementById('trackingNumber').textContent = `Rastreo: ${data.tracking_id}`;
      const badge = document.getElementById('statusBadge');
      badge.textContent = data.status;
      badge.className = `status-badge status-${data.status.toLowerCase().replace(/ /g, '-')}`;
      
      const date = new Date(data.updated_at);
      document.getElementById('updatedAt').textContent = date.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      document.getElementById('recipientName').textContent = data.recipient_name || '-';
      document.getElementById('recipientPhone').textContent = data.recipient_phone || '-';
      document.getElementById('estimatedDelivery').textContent = new Date(data.estimated_delivery).toLocaleDateString('es-CO');
      document.getElementById('carrier').textContent = data.current_carrier || 'En proceso';
      document.getElementById('driver').textContent = data.driver_name || '-';
      document.getElementById('driverPhone').textContent = data.driver_phone || '-';

      if (data.location?.latitude && data.location?.longitude) showMap(data.location);
      if (data.events?.length) displayTimeline(data.events);
      
      const url = window.location.href;
      if (url.includes('/rastreo/')) {
        document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
        document.getElementById('qrSection').style.display = 'block';
      }

      document.getElementById('results').classList.add('active');
    }

    function showMap(loc) {
      document.getElementById('mapContainer').style.display = 'block';
      if (!map) {
        map = L.map('map').setView([loc.latitude, loc.longitude], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      }
      if (marker) map.removeLayer(marker);
      marker = L.marker([loc.latitude, loc.longitude]).addTo(map).bindPopup(`${loc.city}`).openPopup();
    }

    function displayTimeline(events) {
      document.getElementById('timeline').innerHTML = events.map(e => {
        const date = new Date(e.timestamp).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `<div class="timeline-event"><div class="timeline-dot"></div><div class="timeline-content"><h4>${e.status}</h4><span class="time">${date}</span>${e.description ? `<p>${e.description}</p>` : ''}</div></div>`;
      }).join('');
    }

    function showLoading(show) { document.getElementById('loading').classList.toggle('active', show); }
    function showError(msg) { const e = document.getElementById('error'); e.textContent = msg; e.classList.add('active'); }
    
    document.getElementById('trackingInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') searchTracking(); });
  </script>
</body>
</html>
